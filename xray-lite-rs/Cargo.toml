[package]
name = "xray-lite-rs"
version = "1.0.0"
edition = "2021"
description = "High-performance, low-memory Rust Xray-core compatible server (VLESS, VMess AEAD, Trojan over TCP/TLS/WS/HTTPUpgrade/gRPC)"
license = "MPL-2.0"

[[bin]]
name = "xray-lite"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"] }
socket2 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
md-5 = "0.10"
aes = "0.8"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
crc32fast = "1"
base64 = "0.22"
rand = "0.8"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pemfile = "2"
h2 = "0.4"
http = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
