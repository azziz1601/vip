[package]
name = "ws-rs"
version = "1.1.0"
edition = "2021"
description = "Ultra-lightweight Rust HTTP-Upgrade / WebSocket-to-TCP proxy (drop-in replacement for ws-epro)"
license = "MIT"

[lib]
name = "ws_rs"
path = "src/lib.rs"

[[bin]]
name = "ws"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"] }
socket2 = "0.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
