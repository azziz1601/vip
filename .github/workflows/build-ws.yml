name: Build & Release ws-rs

on:
  push:
    branches: ["main"]
    paths:
      - "ws-rs/**"
      - ".github/workflows/build-ws.yml"
    tags: ["v*"]
  pull_request:
    branches: ["main"]
    paths:
      - "ws-rs/**"
      - ".github/workflows/build-ws.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test ws-rs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ws-rs -> target
      - run: cargo test --manifest-path ws-rs/Cargo.toml --verbose

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact_name: ws-linux-amd64
            linker: ""
          - target: aarch64-unknown-linux-musl
            artifact_name: ws-linux-arm64
            linker: aarch64-linux-gnu-gcc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install musl linker
        run: |
          sudo apt-get update
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          else
            sudo apt-get install -y musl-tools
          fi

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ws-rs -> target

      - name: Build static release binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: ${{ matrix.linker }}
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --manifest-path ws-rs/Cargo.toml --target ${{ matrix.target }}

      - name: Package binary
        run: |
          mkdir -p dist
          cp ws-rs/target/${{ matrix.target }}/release/ws dist/${{ matrix.artifact_name }}
          chmod +x dist/${{ matrix.artifact_name }}
          (cd dist && sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256)
          file dist/${{ matrix.artifact_name }}
          ls -lh dist/${{ matrix.artifact_name }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
