name: Build & Release vip-menu (Go TUI)

on:
  push:
    branches: ["main"]
    paths:
      - "vip-menu/**"
      - ".github/workflows/build-menu.yml"
    tags: ["v*"]
  pull_request:
    branches: ["main"]
    paths:
      - "vip-menu/**"
      - ".github/workflows/build-menu.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test vip-menu
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vip-menu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go mod tidy
      - run: go vet ./...
      - run: go test -v ./...

  build:
    name: Build (${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vip-menu
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            artifact_name: vip-menu-linux-amd64
          - goarch: arm64
            artifact_name: vip-menu-linux-arm64

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build static Go binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go mod tidy
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/${{ matrix.artifact_name }} .
          chmod +x dist/${{ matrix.artifact_name }}
          (cd dist && sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256)
          file dist/${{ matrix.artifact_name }}
          ls -lh dist/${{ matrix.artifact_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: vip-menu/dist/*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
