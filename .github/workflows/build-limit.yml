name: Build & Release zevpn-limit

on:
  push:
    branches: ["main"]
    paths:
      - "zevpn-limit/**"
      - ".github/workflows/build-limit.yml"
    tags: ["v*"]
  pull_request:
    branches: ["main"]
    paths:
      - "zevpn-limit/**"
      - ".github/workflows/build-limit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact_name: zevpn-limit-linux-amd64
            linker: ""
          - target: aarch64-unknown-linux-musl
            artifact_name: zevpn-limit-linux-arm64
            linker: aarch64-linux-gnu-gcc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install musl linker
        run: |
          sudo apt-get update
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          else
            sudo apt-get install -y musl-tools
          fi

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zevpn-limit -> target

      - name: Build static release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: ${{ matrix.linker }}
        run: cargo build --release --manifest-path zevpn-limit/Cargo.toml --target ${{ matrix.target }}

      - name: Package binary
        run: |
          mkdir -p dist
          cp zevpn-limit/target/${{ matrix.target }}/release/zevpn-limit dist/${{ matrix.artifact_name }}
          chmod +x dist/${{ matrix.artifact_name }}
          (cd dist && sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
